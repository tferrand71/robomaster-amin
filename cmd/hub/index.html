<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>RoboMaster Hub</title>
<style>
  :root { --bg: #111; --fg: #eee; --btn: #2a2a2a; --btn-on: #3d6bd9; --muted: #999; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  header { display: flex; gap: 16px; padding: 8px 16px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
  header b { color: var(--fg); }
  #video { display: block; width: 100%; max-height: 55vh; object-fit: contain; background: #000; }
  main { display: flex; flex-wrap: wrap; justify-content: space-around; gap: 16px; padding: 16px; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 6px; }
  .pad h3 { grid-column: 1 / 4; margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
  button { background: var(--btn); color: var(--fg); border: 0; border-radius: 10px; font-size: 22px; touch-action: none; }
  button.on { background: var(--btn-on); }
  .actions { display: flex; flex-direction: column; gap: 8px; }
  .actions button { padding: 14px 20px; font-size: 16px; }
  #ir { background: #b83232; }
  .hint { width: 100%; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <span>Robot : <b id="conn">…</b></span>
  <span>Batterie : <b id="bat">…</b></span>
  <span>Appareils connectés : <b id="dev">…</b></span>
  <a href="/app/" style="margin-left: auto; color: var(--fg);">Interface 3D</a>
</header>
<img id="video" src="/video.mjpeg" alt="Vidéo du robot">
<main>
  <div class="pad" style="grid-template-rows: 20px repeat(3, 64px)">
    <h3>Tourelle</h3>
    <span></span><button data-gimbal="60,0">▲</button><span></span>
    <button data-gimbal="0,-60">◀</button><button id="center">●</button><button data-gimbal="0,60">▶</button>
    <span></span><button data-gimbal="-60,0">▼</button><span></span>
  </div>
  <div class="actions">
    <button id="ir">Infrarouge</button>
  </div>
  <p class="hint">Clavier : flèches (tourelle), espace (infrarouge)</p>
</main>
<script>
const deviceId = (() => {
  try {
    let id = localStorage.getItem('rm-device');
    if (!id) { id = crypto.randomUUID(); localStorage.setItem('rm-device', id); }
    return id;
  } catch { return Math.random().toString(36).slice(2); }
})();

const post = (url, body) => fetch(url, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: body ? JSON.stringify(body) : undefined,
}).catch(() => {});

// Commands are repeated while held; the hub stops the robot on its own if they stop arriving.
function hold(send) {
  let timer = null;
  return {
    start() { if (!timer) { send(); timer = setInterval(send, 150); } },
    stop() { clearInterval(timer); timer = null; },
  };
}

function bind(btn, h) {
  const start = e => { e.preventDefault(); btn.classList.add('on'); h.start(); };
  const stop = () => { btn.classList.remove('on'); h.stop(); };
  btn.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
}

const holds = {};
document.querySelectorAll('[data-gimbal]').forEach(btn => {
  const [pitch, yaw] = btn.dataset.gimbal.split(',').map(Number);
  bind(btn, holds[btn.dataset.gimbal] = hold(() => post('/api/gimbal/speed', { Pitch: pitch, Yaw: yaw })));
});
document.getElementById('center').onclick = () => post('/api/gimbal/reset');
const fireInfrared = () => post('/api/gun/fire?type=infrared');
document.getElementById('ir').onclick = fireInfrared;

const keys = { ArrowUp: '60,0', ArrowDown: '-60,0', ArrowLeft: '0,-60', ArrowRight: '0,60' };
addEventListener('keydown', e => {
  if (e.key === ' ') { fireInfrared(); e.preventDefault(); return; }
  const h = holds[keys[e.key]];
  if (h) { h.start(); e.preventDefault(); }
});
addEventListener('keyup', e => { const h = holds[keys[e.key]]; if (h) h.stop(); });
addEventListener('blur', () => Object.values(holds).forEach(h => h.stop()));

async function status() {
  try {
    const s = await (await fetch('/api/status?device=' + deviceId)).json();
    document.getElementById('conn').textContent = s.connected ? 'connecté' : 'déconnecté';
    document.getElementById('bat').textContent = s.battery + ' %';
    document.getElementById('dev').textContent = s.devices;
  } catch {
    document.getElementById('conn').textContent = 'hub injoignable';
  }
}
status();
setInterval(status, 2000);
</script>
</body>
</html>
